<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  body {
    background: #141414;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 30px;
  }

  .split-flap-display {
    display: flex;
    gap: 12px;
    background: #171719;
    padding: 16px 20px;
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
  }

  /* Exactly 26px width x 38px height (half is 19px) */
  .flip-tile {
    position: relative;
    width: 26px;
    height: 38px;
    border-radius: 4px;
    perspective: 300px;
    user-select: none;
  }

  /* FIXED CENTER SEAM BAR (Z-Index 50: NEVER MOVES, NEVER SHIFTS) */
  .seam-bar {
    position: absolute;
    top: 19px;
    left: 0;
    right: 0;
    height: 1px;
    background: #09090b;
    z-index: 50;
    pointer-events: none;
  }

  /* FIXED SIDE HINGE PINS (Z-Index 50) */
  .hinge-tab {
    position: absolute;
    top: 19px;
    width: 2px;
    height: 5px;
    margin-top: -2.5px;
    background: #5a5a5e;
    z-index: 50;
    border-radius: 0.5px;
    pointer-events: none;
  }
  .hinge-tab.left { left: -1px; }
  .hinge-tab.right { right: -1px; }

  /* BASE HALF CARDS */
  .card-half {
    overflow: hidden;
    position: absolute;
    left: 0;
    right: 0;
    height: 19px;
    background: #202023;
  }

  .card-top {
    top: 0;
    border-radius: 4px 4px 0 0;
    background: #232326;
  }

  .card-bottom {
    top: 19px;
    border-radius: 0 0 4px 4px;
    background: #1a1a1d;
  }

  /* DIGIT TYPOGRAPHY */
  .digit {
    position: absolute;
    left: 0;
    right: 0;
    height: 38px;
    line-height: 38px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    color: #e2e2e5;
    letter-spacing: -0.02em;
  }

  .card-top .digit {
    top: 0;
  }

  .card-bottom .digit {
    top: -19px;
  }

  /* 3D FLIPPING LEAVES */
  .flip-leaf {
    position: absolute;
    left: 0;
    right: 0;
    height: 19px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
  }

  /* Upper leaf: folds down around bottom edge */
  .leaf-top {
    top: 0;
    border-radius: 4px 4px 0 0;
    background: #232326;
    transform-origin: bottom center;
    z-index: 20;
    animation: foldDown 180ms ease-in forwards;
  }

  @keyframes foldDown {
    0% {
      transform: rotateX(0deg);
    }
    100% {
      transform: rotateX(-90deg);
      opacity: 0;
    }
  }

  /* Lower leaf: drops down from 90deg to 0deg around top edge */
  .leaf-bottom {
    top: 19px;
    border-radius: 0 0 4px 4px;
    background: #1a1a1d;
    transform-origin: top center;
    transform: rotateX(90deg);
    z-index: 30;
    animation: dropFlat 190ms cubic-bezier(0.2, 0.9, 0.4, 1.1) 160ms forwards;
  }

  @keyframes dropFlat {
    0% {
      transform: rotateX(90deg);
    }
    100% {
      transform: rotateX(0deg);
    }
  }

  /* Subtle Mechanical Shadows */
  .leaf-top::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 20%, rgba(0, 0, 0, 0.65));
    opacity: 0;
    animation: shadowIn 180ms ease-in forwards;
  }

  @keyframes shadowIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .leaf-bottom::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, transparent 20%, rgba(0, 0, 0, 0.65));
    opacity: 1;
    animation: shadowOut 190ms ease-out 160ms forwards;
  }

  @keyframes shadowOut {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  button {
    background: #28282c;
    color: #dedede;
    border: none;
    padding: 9px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  button:hover { background: #34343a; }
</style>
</head>
<body>

<div class="split-flap-display">
  <div class="flip-tile" id="tile1">
    <!-- FIXED MIDDLE SEAM AND HINGE PINS (Z-50) -->
    <div class="seam-bar"></div>
    <div class="hinge-tab left"></div>
    <div class="hinge-tab right"></div>

    <!-- STATIC BASE CARDS -->
    <div class="card-half card-top"><span class="digit">5</span></div>
    <div class="card-half card-bottom"><span class="digit">5</span></div>
  </div>
</div>

<button id="btnFlip">Flip Next Digit</button>

<script>
  let currentVal = 5;
  const tile = document.getElementById('tile1');
  const baseTopDigit = tile.querySelector('.card-top .digit');
  const baseBottomDigit = tile.querySelector('.card-bottom .digit');

  function flipTo(nextVal) {
    const oldVal = currentVal;
    currentVal = nextVal;

    // 1. Static top card immediately gets the new digit (uncovered when leaf folds)
    baseTopDigit.textContent = nextVal;

    // 2. Remove any previous leaves
    tile.querySelectorAll('.flip-leaf').forEach(el => el.remove());

    // 3. Create Upper Folding Leaf (shows oldVal top, folds down 0deg -> -90deg)
    const leafTop = document.createElement('div');
    leafTop.className = 'flip-leaf leaf-top';
    leafTop.innerHTML = `<span class="digit">${oldVal}</span>`;

    // 4. Create Lower Dropping Leaf (shows nextVal bottom, drops 90deg -> 0deg)
    const leafBottom = document.createElement('div');
    leafBottom.className = 'flip-leaf leaf-bottom';
    leafBottom.innerHTML = `<span class="digit" style="top: -19px;">${nextVal}</span>`;

    tile.appendChild(leafTop);
    tile.appendChild(leafBottom);

    // 5. When the dropping leaf lands at 0deg: settle static bottom and remove leaves
    leafBottom.addEventListener('animationend', () => {
      baseBottomDigit.textContent = nextVal;
      leafTop.remove();
      leafBottom.remove();
    }, { once: true });
  }

  document.getElementById('btnFlip').addEventListener('click', () => {
    const next = currentVal > 0 ? currentVal - 1 : 9;
    flipTo(next);
  });
</script>
</body>
</html>
